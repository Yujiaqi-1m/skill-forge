<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=ZCOOL+KuaiLe&amp;display=swap');
      text { font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; }
      .label-en { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif; }
    </style>
    <!-- sketch filter: shapes ONLY, never connectors -->
    <filter id="sketchy" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch-blue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a0c4f0" stroke-width="1.5" opacity="0.4"/>
    </pattern>
    <pattern id="hatch-orange" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f0d080" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-green" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5a9e6f" stroke-width="1.5" opacity="0.4"/>
    </pattern>
    <pattern id="hatch-purple" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b4a0e8" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-gray" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c9c9c9" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#3b82d0"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#d4920a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#2d8a4e"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#777"/>
    </marker>
  </defs>

  <!-- ===== title ===== -->
  <text x="800" y="96" font-size="56" fill="#1e40af" text-anchor="middle">发布流程</text>
  <path d="M 660 118 Q 800 132 940 116" fill="none" stroke="#3b82d0" stroke-width="4"/>
  <text x="800" y="152" font-size="26" fill="#64748b" text-anchor="middle">main 合入 → CI 构建 → 预发验收 → 生产发布</text>

  <!-- ===== legend (top-right) ===== -->
  <line x1="1260" y1="180" x2="1320" y2="180" stroke="#3b82d0" stroke-width="3"/>
  <text x="1335" y="189" font-size="24" fill="#475569">正常流程</text>
  <line x1="1260" y1="222" x2="1320" y2="222" stroke="#777" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1335" y="231" font-size="24" fill="#475569">失败告警</text>

  <!-- ===== actor: engineer (blue ellipse) ===== -->
  <ellipse cx="150" cy="350" rx="90" ry="60" fill="url(#hatch-blue)" stroke="#3b82d0" stroke-width="3.5" filter="url(#sketchy)"/>
  <ellipse cx="150" cy="350" rx="90" ry="60" fill="#dbeafe" opacity="0.25"/>
  <text x="150" y="362" font-size="34" fill="#1e40af" text-anchor="middle">工程师</text>

  <!-- ===== step 1: merge to main (blue rect) ===== -->
  <rect x="280" y="280" width="200" height="140" rx="10" fill="url(#hatch-blue)" stroke="#3b82d0" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="280" y="280" width="200" height="140" rx="10" fill="#dbeafe" opacity="0.25"/>
  <text x="380" y="340" font-size="30" fill="#1e40af" text-anchor="middle">功能合入</text>
  <text x="380" y="384" font-size="26" fill="#1e40af" text-anchor="middle"><tspan class="label-en">main</tspan> 分支</text>

  <!-- ===== step 2: CI container (orange) ===== -->
  <rect x="540" y="250" width="260" height="200" rx="18" fill="url(#hatch-orange)" stroke="#d4920a" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="540" y="250" width="260" height="200" rx="18" fill="#fef3c7" opacity="0.3"/>
  <text x="670" y="292" font-size="28" fill="#92400e" text-anchor="middle"><tspan class="label-en">CI</tspan> 自动执行</text>
  <rect x="570" y="306" width="200" height="52" rx="8" fill="#fef3c7" opacity="0.9" stroke="#d4920a" stroke-width="2.5" filter="url(#sketchy)"/>
  <text x="670" y="341" font-size="26" fill="#92400e" text-anchor="middle">构建</text>
  <rect x="570" y="372" width="200" height="52" rx="8" fill="#fef3c7" opacity="0.9" stroke="#d4920a" stroke-width="2.5" filter="url(#sketchy)"/>
  <text x="670" y="407" font-size="26" fill="#92400e" text-anchor="middle">测试</text>

  <!-- ===== step 3: build image (green parallelogram) ===== -->
  <path d="M 995 285 L 1170 285 L 1145 415 L 970 415 Z" fill="url(#hatch-green)" stroke="#2d8a4e" stroke-width="3.5" filter="url(#sketchy)"/>
  <path d="M 995 285 L 1170 285 L 1145 415 L 970 415 Z" fill="#d1fae5" opacity="0.28"/>
  <text x="1070" y="342" font-size="28" fill="#065f46" text-anchor="middle">打出镜像</text>
  <text x="1070" y="384" font-size="22" fill="#065f46" text-anchor="middle" class="label-en">docker image</text>

  <!-- ===== step 4: deploy staging (green rect) ===== -->
  <rect x="1230" y="280" width="220" height="140" rx="10" fill="url(#hatch-green)" stroke="#2d8a4e" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="1230" y="280" width="220" height="140" rx="10" fill="#d1fae5" opacity="0.28"/>
  <text x="1340" y="337" font-size="28" fill="#065f46" text-anchor="middle">部署到</text>
  <text x="1340" y="380" font-size="30" fill="#065f46" text-anchor="middle">预发环境</text>

  <!-- ===== step 5: QA acceptance (green diamond) ===== -->
  <path d="M 1340 575 L 1470 650 L 1340 725 L 1210 650 Z" fill="url(#hatch-green)" stroke="#2d8a4e" stroke-width="3.5" filter="url(#sketchy)"/>
  <path d="M 1340 575 L 1470 650 L 1340 725 L 1210 650 Z" fill="#d1fae5" opacity="0.28"/>
  <text x="1340" y="646" font-size="30" fill="#065f46" text-anchor="middle"><tspan class="label-en">QA</tspan> 验收</text>
  <text x="1340" y="690" font-size="24" fill="#065f46" text-anchor="middle">通过？</text>

  <!-- ===== step 6: owner clicks release (purple rect) ===== -->
  <rect x="790" y="585" width="220" height="130" rx="10" fill="url(#hatch-purple)" stroke="#7c3aed" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="790" y="585" width="220" height="130" rx="10" fill="#ede9fe" opacity="0.28"/>
  <text x="900" y="638" font-size="28" fill="#5b21b6" text-anchor="middle">负责人确认</text>
  <text x="900" y="682" font-size="28" fill="#5b21b6" text-anchor="middle">点击「上线」</text>

  <!-- ===== step 7: production (purple rect) ===== -->
  <rect x="410" y="585" width="220" height="130" rx="10" fill="url(#hatch-purple)" stroke="#7c3aed" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="410" y="585" width="220" height="130" rx="10" fill="#ede9fe" opacity="0.28"/>
  <text x="520" y="638" font-size="28" fill="#5b21b6" text-anchor="middle">发布到生产</text>
  <text x="520" y="680" font-size="22" fill="#5b21b6" text-anchor="middle" class="label-en">Production</text>

  <!-- ===== failure handler: Slack (gray rect) ===== -->
  <rect x="980" y="750" width="350" height="100" rx="12" fill="url(#hatch-gray)" stroke="#777" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="980" y="750" width="350" height="100" rx="12" fill="#f3f4f6" opacity="0.35"/>
  <text x="1155" y="792" font-size="28" fill="#4b5563" text-anchor="middle"><tspan class="label-en">Slack</tspan> 通知值班同学</text>
  <text x="1155" y="832" font-size="24" fill="#4b5563" text-anchor="middle">处理故障</text>

  <!-- ===== main flow connectors (NO filter) ===== -->
  <line x1="245" y1="350" x2="273" y2="350" stroke="#3b82d0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="485" y1="350" x2="533" y2="350" stroke="#d4920a" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="805" y1="350" x2="973" y2="350" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="890" y="320" font-size="24" fill="#065f46" text-anchor="middle">全部通过 ✓</text>
  <line x1="1163" y1="350" x2="1223" y2="350" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1340" y1="425" x2="1340" y2="568" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="1185" y1="650" x2="1018" y2="650" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="1100" y="624" font-size="24" fill="#5b21b6" text-anchor="middle">通过 ✓</text>
  <line x1="785" y1="650" x2="638" y2="650" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- ===== failure connectors: dashed gray (NO filter) ===== -->
  <!-- merge-fail bus: from main box down, into Slack left edge -->
  <path d="M 380 425 L 380 820 L 973 820" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10" marker-end="url(#arrow-gray)"/>
  <text x="404" y="470" font-size="26" fill="#777">✗</text>
  <text x="430" y="800" font-size="24" fill="#777">任一环节失败 ✗</text>
  <!-- CI fail drops onto the bus -->
  <path d="M 670 455 L 670 816" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="694" y="492" font-size="26" fill="#777">✗</text>
  <text x="692" y="565" font-size="22" fill="#777">构建 / 测试失败</text>
  <!-- release-click fail drops onto the bus -->
  <path d="M 900 720 L 900 816" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="922" y="748" font-size="26" fill="#777">✗</text>
  <!-- image fail: straight into Slack top -->
  <path d="M 1070 420 L 1070 743" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10" marker-end="url(#arrow-gray)"/>
  <text x="1094" y="452" font-size="26" fill="#777">✗</text>
  <text x="1090" y="595" font-size="22" fill="#777">打镜像失败</text>
  <!-- staging-deploy fail: wrap right lane into Slack right edge -->
  <path d="M 1455 350 L 1530 350 L 1530 835 L 1338 835" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10" marker-end="url(#arrow-gray)"/>
  <text x="1480" y="328" font-size="26" fill="#777">✗</text>
  <!-- QA fail joins the right lane -->
  <path d="M 1478 650 L 1526 650" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1486" y="684" font-size="22" fill="#777" text-anchor="middle">不通过</text>
  <!-- on-call fixes, back to engineer (feedback loop) -->
  <path d="M 1155 850 L 1155 878 L 40 878 L 40 470 L 150 470 L 150 417" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10" marker-end="url(#arrow-gray)"/>
  <text x="120" y="504" font-size="22" fill="#777" text-anchor="middle">处理后重新提交</text>
</svg>
